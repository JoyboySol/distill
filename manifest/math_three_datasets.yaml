model: Nanbeige4.1-3B
ports:
  - 6758-6765

concurrency: 2048
judge_concurrency: 16
active_files: 32
rollout_count: 4
max_tokens: 16000
batch_size: 1000

segment_size_mb: 1
segment_flush_interval_sec: 10
shard_size_mb: 200
write_retries: 3

task_schedule: round_robin
round_robin_chunk_size: 1250

merge_every_n_writes:
upload_every_n_merges:
upload_merged_shards: true
treat_no_judge_as_correct: true
hf_repo_id: JoyboyGo/hf_data
hf_repo_type: dataset
hf_remote_prefix:
hf_token:

tasks:
  - task_name: math_lighteval
    input_dir: /mnt/hdd/lvzhihao/data/MATH-lighteval
    output_dir: /mnt/hdd/lvzhihao/output/distill/MATH-lighteval
    failure_log: math_lighteval_failed.jsonl
    file_pattern: "*/train-*.parquet"
    input_field: problem
    # MATH-lighteval 的 gold answer 在 `solution` 里，最终答案包在 `\\boxed{}` 中。
    # 交给 math_verify 时会直接从 solution 里做 boxed 抽取。
    label_field: solution
    rollout_count: 4

  - task_name: openr1_math_220k
    input_dir: /mnt/hdd/lvzhihao/data/OpenR1-Math-220k
    output_dir: /mnt/hdd/lvzhihao/output/distill/OpenR1-Math-220k
    failure_log: openr1_math_220k_failed.jsonl
    file_pattern: "all/*.parquet"
    input_field: problem
    # 直接走 math_verify。
    label_field: answer
    rollout_count: 4

  - task_name: math_sft_40k
    input_dir: /mnt/hdd/lvzhihao/data/math_sft_40K
    output_dir: /mnt/hdd/lvzhihao/output/distill/math_sft_40K
    failure_log: math_sft_40k_failed.jsonl
    file_pattern: train.jsonl
    input_field: question
    # 直接走 math_verify。
    label_field: golden_answer
    rollout_count: 4
